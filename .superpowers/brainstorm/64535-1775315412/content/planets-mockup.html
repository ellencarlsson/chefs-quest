<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chefs Quest — Planet Map</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #1a0a3a 0%, #0a0415 60%, #000 100%);
    font-family: 'Georgia', serif;
    color: #F5E6C8;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* Stars */
  .stars {
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 15% 20%, white, transparent),
      radial-gradient(1px 1px at 40% 70%, white, transparent),
      radial-gradient(1px 1px at 70% 15%, white, transparent),
      radial-gradient(1px 1px at 85% 55%, white, transparent),
      radial-gradient(1px 1px at 25% 80%, white, transparent),
      radial-gradient(1px 1px at 60% 40%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 90% 85%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1.5px 1.5px at 10% 50%, rgba(255,200,100,0.8), transparent),
      radial-gradient(1px 1px at 50% 90%, white, transparent),
      radial-gradient(1px 1px at 75% 30%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 35% 10%, white, transparent),
      radial-gradient(1px 1px at 5% 65%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 95% 40%, white, transparent),
      radial-gradient(1px 1px at 20% 45%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 55% 60%, white, transparent);
  }

  /* Top bar */
  .topbar {
    position: relative; z-index:10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px 8px;
  }
  .topbar .title { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: #C4914A; }
  .xp-badge {
    background: rgba(196,145,74,0.2);
    border: 1px solid rgba(196,145,74,0.5);
    border-radius: 99px;
    padding: 5px 14px;
    font-size: 13px;
    color: #F5C842;
    font-weight: bold;
  }

  /* Map area */
  .map {
    position: relative;
    width: 100%;
    height: calc(100vh - 110px);
  }

  /* Path between planets */
  .path {
    position: absolute;
    border: 2px dashed rgba(196,145,74,0.25);
    border-radius: 999px;
    pointer-events: none;
  }

  /* Planet */
  .planet {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transform: translate(-50%, -50%);
  }

  .planet-orb {
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 30px var(--glow), inset -8px -8px 20px rgba(0,0,0,0.4), inset 4px 4px 12px rgba(255,255,255,0.15);
    font-size: var(--emoji-size, 36px);
    animation: bob var(--bob-speed, 4s) ease-in-out infinite;
    animation-delay: var(--bob-delay, 0s);
    position: relative;
  }

  .planet-orb::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 10%;
    width: 80%;
    height: 10px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.4), transparent);
    border-radius: 50%;
    filter: blur(4px);
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .planet-name {
    margin-top: 10px;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(0,0,0,0.8);
  }
  .planet-sub {
    font-size: 10px;
    color: rgba(245,230,200,0.6);
    margin-top: 1px;
  }

  /* Ring around locked planet */
  .ring {
    position: absolute;
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 50%;
    animation: spin 12s linear infinite;
    pointer-events: none;
  }
  @keyframes spin { to { transform: rotate(360deg) rotateX(70deg); } }

  .locked-badge {
    position: absolute;
    top: -4px; right: -4px;
    background: #1a0a3a;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: space-around;
    background: rgba(20,8,40,0.9);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(196,145,74,0.2);
    padding: 10px 0 16px;
  }
  .nav-item { text-align: center; font-size: 10px; color: rgba(245,230,200,0.4); }
  .nav-item .icon { font-size: 22px; display: block; margin-bottom: 2px; }
  .nav-item.active { color: #C4914A; }
</style>
</head>
<body>

<div class="stars"></div>

<div class="topbar">
  <div class="title">Chefs Quest</div>
  <div class="xp-badge">⭐ 340 XP</div>
</div>

<div class="map">

  <!-- Breakfast Planet — top left, big, accessible -->
  <div class="planet" style="left:28%;top:22%;">
    <div class="planet-orb" style="
      width:100px;height:100px;
      background: radial-gradient(circle at 35% 35%, #FFE082, #F5A623, #B7660A);
      --glow: rgba(245,166,35,0.6);
      --bob-speed: 5s;
      --bob-delay: 0s;
      --emoji-size: 42px;
    ">🍳</div>
    <div class="planet-name" style="color:#FFD54F;">Breakfast</div>
    <div class="planet-sub">4/6 mastered</div>
  </div>

  <!-- Lunch Planet — right side -->
  <div class="planet" style="left:72%;top:38%;">
    <div class="planet-orb" style="
      width:80px;height:80px;
      background: radial-gradient(circle at 35% 35%, #A5D6A7, #4CAF50, #1B5E20);
      --glow: rgba(76,175,80,0.5);
      --bob-speed: 6s;
      --bob-delay: 1.5s;
      --emoji-size: 32px;
    ">🥗</div>
    <div class="planet-name" style="color:#81C784;">Lunch</div>
    <div class="planet-sub">2/8 mastered</div>
  </div>

  <!-- Dinner Planet — center bottom, biggest -->
  <div class="planet" style="left:45%;top:60%;">
    <div class="planet-orb" style="
      width:120px;height:120px;
      background: radial-gradient(circle at 35% 35%, #FF8A65, #E64A19, #7B1600);
      --glow: rgba(230,74,25,0.7);
      --bob-speed: 7s;
      --bob-delay: 0.8s;
      --emoji-size: 50px;
    ">🍽️</div>
    <div class="planet-name" style="color:#FF8A65;">Dinner</div>
    <div class="planet-sub">8/10 mastered</div>
  </div>

  <!-- Snacks Planet — top right, locked -->
  <div class="planet" style="left:80%;top:16%;opacity:0.5;">
    <div class="planet-orb" style="
      width:65px;height:65px;
      background: radial-gradient(circle at 35% 35%, #9575CD, #512DA8, #1A0050);
      --glow: rgba(81,45,168,0.3);
      --bob-speed: 4.5s;
      --bob-delay: 2s;
      --emoji-size: 26px;
      filter: grayscale(0.4);
    ">🍿
      <div class="locked-badge">🔒</div>
    </div>
    <div class="planet-name" style="color:#9575CD;">Snacks</div>
    <div class="planet-sub">Unlock: 500 XP</div>
  </div>

  <!-- Dashed paths between planets -->
  <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path d="M 28 22 Q 50 30 72 38" stroke="rgba(196,145,74,0.2)" stroke-width="0.3" stroke-dasharray="1,2" fill="none"/>
    <path d="M 72 38 Q 60 48 45 60" stroke="rgba(196,145,74,0.2)" stroke-width="0.3" stroke-dasharray="1,2" fill="none"/>
    <path d="M 28 22 Q 36 40 45 60" stroke="rgba(196,145,74,0.15)" stroke-width="0.3" stroke-dasharray="1,2" fill="none"/>
    <path d="M 72 38 Q 76 28 80 16" stroke="rgba(150,100,200,0.15)" stroke-width="0.3" stroke-dasharray="1,2" fill="none"/>
  </svg>

</div>

<div class="bottom-nav">
  <div class="nav-item active"><span class="icon">🌌</span>Map</div>
  <div class="nav-item"><span class="icon">📖</span>Recipes</div>
  <div class="nav-item"><span class="icon">👤</span>Profile</div>
</div>

</body>
</html>
